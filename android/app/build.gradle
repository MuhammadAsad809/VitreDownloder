apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.chaquo.python"

android {
    ndkVersion rootProject.ext.has('ndkVersion') ? rootProject.ext.ndkVersion : "26.1.10909125"
    compileSdkVersion 34
    namespace "com.vitre.downloader"

    defaultConfig {
        applicationId "com.vitre.downloader"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "yt-dlp"
                install "certifi"
            }
        }
    }

    buildTypes {
        debug {
            // Uses Android Gradle default auto-generated debug keystore
        }
        release {
            minifyEnabled false
        }
    }
}

react {
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    cliFile = file("../../node_modules/react-native/cli.js")
    entryFile = file("../../index.js")
    bundleInDebug = true
    bundleInRelease = true
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
